name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # steps.if 에서는 secrets 컨텍스트를 쓸 수 없으므로 job env 로 옮긴다
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Android SDK 는 ubuntu-latest 러너에 사전 설치(ANDROID_HOME 설정됨). AGP 가 필요한 platform/build-tools 를 자동 설치한다.
      # android-actions/setup-android 는 기본으로 존재하지 않는 'tools' 패키지를 sdkmanager 로 설치하려다 실패(exit 1)하므로 쓰지 않는다.
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK check
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | head -20

      # 서명 keystore: GitHub Secrets (없으면 debug 키로 서명 — 경고만 출력)
      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 0.1.${{ github.run_number }}
          POGO_SERVER_URL: ${{ vars.POGO_SERVER_URL }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release*.apk "pogo-doctor-collector-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pogo-doctor-collector-apk
          path: android/pogo-doctor-collector-*.apk
          retention-days: 30

      - name: Release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: 수집기 APK 0.1.${{ github.run_number }}
          body: |
            Galaxy A90 설치: 아래 APK 를 내려받아 설치 ("출처를 알 수 없는 앱" 허용). 같은 keystore 로 서명되어 기존 설치 위에 업데이트됩니다.
            커밋: ${{ github.sha }}
          files: android/pogo-doctor-collector-*.apk
